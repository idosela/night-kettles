<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Night Kettles</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen&display=swap">
<style>
/* Layout: one full-bleed night sky. A small options card floats bottom-left
   and fades out when the pointer rests, the way a saver's own chrome would. */
:root {
  color-scheme: dark;
  --night: #070917;
  --card: #0e1130;
  --line: #2b3160;
  --shadow: #02030a;
  --ink: #e4e8fb;
  --dim: #8d95bd;
  --brass: #e5aa2b;   /* the mustard kettle */
  --mint: #72dcc9;    /* the teal kettle's highlight; focus rings */
  --label: "Silkscreen", ui-monospace, "SF Mono", Menlo, monospace;
  --text: system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
}
html, body { height: 100%; }
body {
  box-sizing: border-box;
  overflow: hidden;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--night);
  color: var(--ink);
  font-family: var(--text);
}
body.resting { cursor: none; }

#sky { position: fixed; inset: 0; display: block; width: 100%; height: 100%; }

.card {
  position: fixed;
  left: max(16px, env(safe-area-inset-left, 0px));
  bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  box-sizing: border-box;
  width: min(312px, calc(100% - 32px));
  display: grid;
  gap: 12px;
  padding: 14px 16px;
  background: var(--card);
  border: 2px solid var(--line);
  box-shadow: 4px 4px 0 var(--shadow);
  transition: opacity 0.5s;
}
body.resting .card { opacity: 0; pointer-events: none; }

.card header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; }
.card h1 { margin: 0; font: 400 15px/1 var(--label); letter-spacing: 0.02em; color: var(--brass); }
.buttons { display: flex; gap: 6px; }
.card button {
  padding: 5px 7px 4px;
  font: 400 10px/1 var(--label);
  color: var(--ink);
  background: transparent;
  border: 2px solid var(--line);
  border-radius: 0;
  cursor: pointer;
}
.card button:hover { border-color: var(--dim); }

.options { display: grid; grid-template-columns: auto minmax(0, 1fr) 76px; align-items: center; gap: 8px 12px; }
.options label { font: 400 11px/1 var(--label); color: var(--dim); }
.options output { font-size: 13px; text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }

input[type="range"] { -webkit-appearance: none; appearance: none; width: 100%; height: 20px; margin: 0; background: transparent; cursor: pointer; }
input[type="range"]::-webkit-slider-runnable-track { height: 4px; background: var(--line); }
input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 10px; height: 16px; margin-top: -6px; background: var(--brass); border: 0; border-radius: 0; }
input[type="range"]::-moz-range-track { height: 4px; background: var(--line); }
input[type="range"]::-moz-range-thumb { width: 10px; height: 16px; background: var(--brass); border: 0; border-radius: 0; }
.card button:focus-visible, input[type="range"]:focus-visible { outline: 2px solid var(--mint); outline-offset: 2px; }

.card p { margin: 0; font-size: 12px; line-height: 1.45; color: var(--dim); }
</style>
</head>
<body>
<canvas id="sky" role="img" aria-label="Winged pour-over kettles, cone drippers, plunger brewers and coffee grinders fly across a starry night sky, with coffee cups riding their saucers and beans tumbling alongside."></canvas>

<form class="card" id="card">
  <header>
    <h1>Night Kettles</h1>
    <div class="buttons">
      <button type="button" id="pause">Pause</button>
      <button type="button" id="full">Full screen</button>
    </div>
  </header>
  <div class="options">
    <label for="flock">Flock</label>
    <input type="range" id="flock" min="0.4" max="2" step="0.1" value="1">
    <output id="flock-out" for="flock"></output>
    <label for="speed">Speed</label>
    <input type="range" id="speed" min="0.5" max="2" step="0.1" value="1">
    <output id="speed-out" for="speed"></output>
    <label for="roast">Roast</label>
    <input type="range" id="roast" min="0" max="3" step="1" value="1">
    <output id="roast-out" for="roast"></output>
  </div>
  <p>The saver's Options sheet has the same three sliders. This card hides when the pointer rests.</p>
</form>

// ---- Flight model. saver/NightKettlesView.m mirrors this; change both. ----
const TAU = Math.PI * 2;
const HEADING = 20 * Math.PI / 180;       // climb angle of the flight path
const COS = Math.cos(HEADING), SIN = Math.sin(HEADING);
const FINE = 1.5;                         // sprite pixels per design unit; must match Z in art/make_sprites.py
const TIER_SIZE = [0.5, 0.75, 1];         // far, middle, near
const TIER_PACE = [30, 33, 38];           // design units per second
const TIER_ORDER = [0, 1, 2, 0, 1, 0, 2, 1, 0, 1, 2, 0, 1, 0, 2, 1, 0, 1, 0, 2];   // 40% far, 35% middle, 25% near

// The cast, sized in design units. Everything before the cup has wings: it
// flaps, and comes in as many colourways as its sheet has rows for. Cups come
// in several accents, each in the four roasts; beans only in the four roasts.
const KETTLE = 0, DRIPPER = 1, PRESS = 2, MILL = 3, GRINDER = 4, CUP = 5, BEAN = 6;
const KINDS = [
  {sheet: 'kettle', w: 56, h: 48, tick: 0.085},
  {sheet: 'dripper', w: 56, h: 48, tick: 0.085},
  {sheet: 'press', w: 56, h: 48, tick: 0.085},
  {sheet: 'mill', w: 56, h: 48, tick: 0.085},      // the hand grinder
  {sheet: 'grinder', w: 56, h: 48, tick: 0.085},   // the electric one
  {sheet: 'cup', w: 40, h: 36, tick: 0.16},
  {sheet: 'bean', w: 16, h: 16, tick: 0.13},
];
const KIND_ORDER = [0, 5, 0, 6, 3, 1, 5, 4, 6, 1, 2, 4, 6, 2, 3, 0, 5, 6, 6, 1];   // who takes each slot in the flock
const FLAP = [0, 1, 2, 3, 2, 1];          // wing frames: up, down and back
const PARTICLE = {w: 16, h: 16, tick: 0.17, frames: 5};   // steam puffs and coffee drips
const SPOUT = {x: 53, y: 22};             // the kettle's gooseneck tip, in its sprite
const DRIP = {x: 30, y: 38};              // the underside of the dripper, in its sprite
const STAR_PACE = [1.0, 2.2];             // design units per second, per star layer
const STAR_TONES = [['#2c3154', '#3c4370'], ['#59618f', '#8d97c4', '#dfe5ff']];
const ROASTS = ['Light', 'Medium', 'Dark', 'French'];

const canvas = document.getElementById('sky');
const ctx = canvas.getContext('2d');
const settings = {flock: 1, speed: 1, roast: 1};
const images = {};
let W = 0, H = 0, dpr = 1, crisp = true, sky = null;
let scale = [1, 1, 1];                    // points per design unit, per tier
let crossHalf = 0;                        // half the screen's extent across the flight path
let flyers = [], particles = [], stars = [];
let starDrift = [0, 0];
let paused = matchMedia('(prefers-reduced-motion: reduce)').matches;

const rand = (lo, hi) => lo + Math.random() * (hi - lo);
const wrap = (v, n) => ((v % n) + n) % n;

function layout() {
  W = canvas.clientWidth;
  H = canvas.clientHeight;
  dpr = window.devicePixelRatio || 1;
  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);

  // Device pixels per sprite pixel for the nearest tier. Whole numbers once
  // the screen is big enough, so the pixel art stays crisp.
  const near = Math.min(W, H * 2) * dpr / (400 * FINE);
  crisp = near >= 2.5;
  let sizes = TIER_SIZE.map(size => near * size);
  if (crisp) {
    sizes = TIER_SIZE.map(size => Math.round(Math.round(near) * size));
    if (sizes[0] >= sizes[1]) sizes[0] = sizes[1] - 1;   // keep the far tier smaller than the middle one
  }
  scale = sizes.map(size => size * FINE / dpr);

  crossHalf = (W * SIN + H * COS) / 2;

  sky = ctx.createLinearGradient(0, 0, 0, canvas.height);
  sky.addColorStop(0, '#0b0e26');
  sky.addColorStop(1, '#04050e');

  flyers = [];
  particles = [];
  resizeFlock();
  seedStars();
}

function flockSize() {
  return Math.max(3, Math.round(settings.flock * W * H / (scale[2] * scale[2] * 6200)));
}

function resizeFlock() {
  const count = flockSize();
  while (flyers.length > count) flyers.pop();
  while (flyers.length < count) {
    const slot = flyers.length % TIER_ORDER.length;
    const f = {tier: TIER_ORDER[slot], kind: KIND_ORDER[slot]};
    launch(f, true);
    flyers.push(f);
  }
}

// A flyer's place is (a, p): distance along the flight path and across it,
// measured from the middle of the screen. This is the stretch of lane p for
// which a sprite is at least partly on screen.
function span(p, margin) {
  return [
    Math.max((-W / 2 - margin - p * SIN) / COS, (p * COS - H / 2 - margin) / SIN),
    Math.min((W / 2 + margin - p * SIN) / COS, (p * COS + H / 2 + margin) / SIN),
  ];
}

// Send a flyer in from the upwind edge, or (scatter) drop it anywhere along
// its lane. Of a few random lanes, it takes the one with the most room.
function launch(f, scatter) {
  const s = scale[f.tier];
  f.variant = Math.floor(Math.random() * KINDS[f.kind].colours);   // a colourway, or a cup's accent
  f.speed = TIER_PACE[f.tier] * s * rand(0.92, 1.08);
  f.clock = rand(0, 10);
  f.burst = 2 + Math.floor(Math.random() * 2);
  f.emitIn = rand(0.4, 3.4);

  let bestGap = -1;
  for (let i = 0; i < 6; i++) {
    const p = rand(-crossHalf, crossHalf);
    const [from, to] = span(p, KINDS[f.kind].w * s * 0.6);
    const a = scatter ? rand(from, to) : from;
    let gap = Infinity;
    for (const o of flyers) {
      if (o !== f) gap = Math.min(gap, Math.hypot(o.a - a, o.p - p));
    }
    if (gap > bestGap) {
      bestGap = gap;
      f.a = a;
      f.p = p;
      f.exit = to;
    }
  }
}

function seedStars() {
  let seed = 20261113;
  const next = () => {            // mulberry32: the same sky every time
    seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  const unit = Math.max(1, Math.round(scale[2] * dpr / 4));   // one star pixel, in device pixels
  const count = Math.min(400, Math.max(20, Math.round(W * H / (scale[2] * scale[2] * 520))));
  stars = [];
  for (let i = 0; i < count; i++) {
    const level = next() < 0.6 ? 0 : 1;
    const tones = STAR_TONES[level];
    const bright = next();
    stars.push({
      x: next() * W, y: next() * H, level,
      tone: tones[Math.min(tones.length - 1, Math.floor(bright * bright * tones.length))],
      size: unit * (level === 1 && bright > 0.8 ? 2 : 1),
    });
  }
}

// Where a flyer's sprite is centred, in points. Anything with wings sinks as
// they come up and rises on the downstroke; saucers hover; beans just tumble.
function centre(f) {
  const s = scale[f.tier];
  let bob = 0;
  if (f.kind < CUP) bob = Math.cos(f.clock / (FLAP.length * KINDS[f.kind].tick) * TAU) * 1.5 * s;
  else if (f.kind === CUP) bob = Math.sin(f.clock / 2.6 * TAU) * 2 * s;
  return [W / 2 + f.a * COS + f.p * SIN, H / 2 - f.a * SIN + f.p * COS + bob];
}

// A puff of steam from the kettle's spout, or a drip from under the dripper.
// Steam falls behind and lifts clear of the kettle; a drip keeps most of the
// dripper's speed and falls away.
function emit(f, drop) {
  const s = scale[f.tier];
  const [x, y] = centre(f);
  const v = f.speed * settings.speed;
  particles.push(drop ? {
    drop, tier: f.tier, age: 0,
    x: x + (DRIP.x - 28) * s, y: y + (DRIP.y - 24 + 3) * s,
    vx: v * COS * 0.7, vy: -v * SIN * 0.7, ay: 60 * s,
  } : {
    drop, tier: f.tier, age: 0,
    x: x + (SPOUT.x - 28 + 3) * s, y: y + (SPOUT.y - 24 - 4) * s,
    vx: v * (COS - 0.42), vy: -v * (SIN + 0.34), ay: 0,
  });
}

function step(dt) {
  const speed = settings.speed;
  for (let level = 0; level < 2; level++) starDrift[level] += STAR_PACE[level] * scale[2] * speed * dt;

  for (const f of flyers) {
    f.a += f.speed * speed * dt;
    f.clock += dt;
    if (f.a > f.exit) launch(f, false);
    if (f.kind !== KETTLE && f.kind !== DRIPPER) continue;
    f.emitIn -= dt;
    if (f.emitIn > 0) continue;
    if (f.kind === DRIPPER) {
      emit(f, true);
      f.emitIn = rand(0.7, 1.5);
    } else {                      // the kettle whistles: two or three quick puffs, then a rest
      emit(f, false);
      f.burst--;
      if (f.burst > 0) {
        f.emitIn = 0.26;
      } else {
        f.burst = 2 + Math.floor(Math.random() * 2);
        f.emitIn = rand(2, 4.5);
      }
    }
  }

  for (const p of particles) {
    p.age += dt;
    p.vy += p.ay * dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
  }
  particles = particles.filter(p => p.age < PARTICLE.frames * PARTICLE.tick);
}

function blit(image, cell, frame, row, x, y, s) {
  const w = cell.w * FINE, h = cell.h * FINE;   // the cell in sprite pixels
  ctx.drawImage(image, frame * w, row * h, w, h,
    Math.round(x * dpr - cell.w * s / 2), Math.round(y * dpr - cell.h * s / 2), cell.w * s, cell.h * s);
}

function draw() {
  ctx.imageSmoothingEnabled = !crisp;
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  for (const st of stars) {
    const drift = starDrift[st.level];
    ctx.fillStyle = st.tone;
    ctx.fillRect(Math.round(wrap(st.x - drift * COS, W) * dpr), Math.round(wrap(st.y + drift * SIN, H) * dpr), st.size, st.size);
  }

  for (let tier = 0; tier < 3; tier++) {
    const s = scale[tier] * dpr;
    for (const p of particles) {
      if (p.tier === tier) blit(p.drop ? images.drop : images.puff, PARTICLE, Math.floor(p.age / PARTICLE.tick), tier, p.x, p.y, s);
    }
    for (const f of flyers) {
      if (f.tier !== tier) continue;
      const kind = KINDS[f.kind];
      const winged = f.kind < CUP;
      const tick = Math.floor(f.clock / kind.tick);
      const [x, y] = centre(f);
      blit(images[kind.sheet], kind, winged ? FLAP[tick % FLAP.length] : tick % 4,
        (winged ? f.variant : f.variant * 4 + settings.roast) * 3 + tier, x, y, s);
    }
  }
}

let last = 0;
let stale = true;                         // the canvas changed size: lay out again before drawing
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (stale) {
    stale = false;
    layout();
    showValues();
  }
  if (!paused) step(dt);
  draw();
  requestAnimationFrame(frame);
}

// ---- The options card ----
const $ = id => document.getElementById(id);

function showValues() {
  $('flock-out').textContent = flockSize() + ' aloft';
  $('speed-out').textContent = settings.speed.toFixed(1) + '×';
  $('roast-out').textContent = ROASTS[settings.roast];
  $('pause').textContent = paused ? 'Play' : 'Pause';
}

function remember() {
  try { localStorage.setItem('night-kettles', JSON.stringify(settings)); } catch (e) { /* private window */ }
}

try {
  const saved = JSON.parse(localStorage.getItem('night-kettles') || '{}');
  if (saved.flock >= 0.4 && saved.flock <= 2) settings.flock = saved.flock;
  if (saved.speed >= 0.5 && saved.speed <= 2) settings.speed = saved.speed;
  if ([0, 1, 2, 3].includes(saved.roast)) settings.roast = saved.roast;
} catch (e) { /* no storage: defaults */ }

for (const key of ['flock', 'speed', 'roast']) {
  $(key).value = settings[key];
  $(key).addEventListener('input', () => {
    settings[key] = Number($(key).value);
    if (key === 'flock') resizeFlock();
    showValues();
    remember();
  });
}

$('card').addEventListener('submit', e => e.preventDefault());
$('pause').addEventListener('click', () => { paused = !paused; showValues(); });

if (document.fullscreenEnabled) {
  $('full').addEventListener('click', () => {
    const going = document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
    going.catch(() => {});
  });
  document.addEventListener('fullscreenchange', () => {
    $('full').textContent = document.fullscreenElement ? 'Exit full screen' : 'Full screen';
  });
} else {
  $('full').hidden = true;
}

let restTimer = 0;
function wake() {
  document.body.classList.remove('resting');
  clearTimeout(restTimer);
  restTimer = setTimeout(() => {
    if ($('card').matches(':hover, :focus-within')) wake();
    else document.body.classList.add('resting');
  }, 4000);
}
for (const type of ['pointermove', 'pointerdown', 'keydown']) addEventListener(type, wake);

// ---- Start ----
Promise.all(Object.entries(SPRITES).map(([name, src]) => {
  const image = new Image();
  image.src = src;
  images[name] = image;
  return image.decode();
})).then(() => {
  KINDS.forEach((kind, i) => {     // a sheet has 3 tier rows per colourway, times 4 roasts for cups and beans
    kind.colours = Math.round(images[kind.sheet].naturalHeight / (kind.h * FINE * (i < CUP ? 3 : 12)));
  });
  wake();
  new ResizeObserver(() => { stale = true; }).observe(canvas);
  requestAnimationFrame(now => { last = now; frame(now); });
});
})();
</script>
</body>
</html>
